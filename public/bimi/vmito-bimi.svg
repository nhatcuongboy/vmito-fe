<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>vmito</title>
  <desc>vmito brand logo for BIMI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa64d"/>
      <stop offset="0.5" stop-color="#3f7ad9"/>
      <stop offset="1" stop-color="#8a4fd6"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.5" cy="0.38" r="0.68" fx="0.42" fy="0.3">
      <stop offset="0" stop-color="#7d97a6"/>
      <stop offset="0.55" stop-color="#3a5766"/>
      <stop offset="1" stop-color="#16303f"/>
    </radialGradient>
  </defs>

  <!-- Background (full-bleed; Gmail clips to a circle) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- The "V" / open hand -->
  <path d="M100 250 L256 452 L412 250" fill="none" stroke="#ffffff"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fan stems radiating from the base -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="298" x2="110" y2="198"/>
    <line x1="256" y1="298" x2="176" y2="148"/>
    <line x1="256" y1="298" x2="256" y2="120"/>
    <line x1="256" y1="298" x2="336" y2="148"/>
    <line x1="256" y1="298" x2="402" y2="198"/>
  </g>

  <!-- Connectors between the crown tips (network motif) -->
  <polyline points="110,198 176,148 256,120 336,148 402,198"
            fill="none" stroke="#ffffff" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crown tips -->
  <g fill="#ffffff">
    <circle cx="110" cy="198" r="27"/>
    <circle cx="176" cy="148" r="27"/>
    <circle cx="256" cy="120" r="27"/>
    <circle cx="336" cy="148" r="27"/>
    <circle cx="402" cy="198" r="27"/>
  </g>

  <!-- Glossy dome at the base -->
  <ellipse cx="256" cy="300" rx="46" ry="42" fill="url(#dome)"/>
</svg>
